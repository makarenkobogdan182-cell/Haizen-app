<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Цвета автоматически берутся из темы Телеграма пользователя */
        body {
            background-color: var(--tg-theme-bg-color, #181818);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: var(--tg-theme-button-color, #2481cc);
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Справочник Haizen</h1>
    <p>Здесь будут красиво расписаны все РП-команды, игры и экономика!</p>
    
    <button class="btn" onclick="closeApp()">Понятно, закрыть</button>

    <script>
        // Инициализируем Web App
        let tg = window.Telegram.WebApp;
        
        // Разворачиваем аппку на весь экран
        tg.expand();
        
        // Функция закрытия
        function closeApp() {
            tg.close();
        }
    </script>
</body>
</html>
